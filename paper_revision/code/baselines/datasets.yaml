
defaults:
  table: raw
  outer_test_fraction: 0.20
  search_val_fraction_of_outer: 0.20
  split_seed: 42

datasets:
  esun:
    file: esun.duckdb
    table: raw
    label: "label"
    time_col: null
    drop: [acct]
    desc: >-
      ESUN account-level alert detection (PU labels; 1,004 alert accounts among 333,768 candidates, 29 aggregates); stratified random splits.
  credit_default:
    file: credit_default.duckdb
    table: raw
    label: "default.payment.next.month"
    time_col: null
    drop: [id]
    desc: >-
      UCI Taiwan credit-card default: one row per client; stratified random outer and search-validation splits.
  twitterbot:
    file: twitterbot.duckdb
    table: raw
    label: "is_bot"
    time_col: null
    drop: [id, location]
    desc: >-
      Twitter account bot detection: one row per account; stratified random outer and search-validation splits.
  fraudecom:
    file: fraudecom.duckdb
    table: raw
    label: "class"
    time_col: purchase_ts
    drop: [user_id]
    desc: >-
      E-commerce fraud. Chronological evaluation by purchase time.
  creditcard:
    file: creditcard.duckdb
    table: raw
    label: "class"
    time_col: time
    drop: []
    desc: >-
      ULB credit-card fraud with anonymized PCA columns. Chronological evaluation by Time.
    anonymous_col_pattern: '^v\d+$'
  vehicleloan:
    file: vehicleloan.duckdb
    table: raw
    label: "loan_default"
    time_col: disbursal_date
    drop: [uniqueid, disbursal_date, date_of_birth, average_acct_age, credit_history_length, employment_type, perform_cns_score_description]
    desc: >-
      Vehicle loan default (India L&T, 233k loans, about 21.6% default). Chronological evaluation by disbursal date.
  ieeecis:
    file: ieeecis.duckdb
    table: raw
    label: "isfraud"
    time_col: transactiondt
    drop: [transactionid]
    desc: >-
      IEEE-CIS transaction fraud. Chronological outer test and forward search-validation splits; high-missingness columns kept.
    final_no_xgb: true
    anonymous_col_pattern: '^(v|c|d|m)\d+$|^id_\d+$'
  sparknov:
    file: sparknov.duckdb
    table: raw
    label: "is_fraud"
    time_col: unix_time
    drop: []
    desc: >-
      Sparkov simulated transaction fraud. Chronological evaluation.
    final_no_xgb: true
  banksim:
    file: banksim.duckdb
    table: raw
    label: "fraud"
    time_col: step
    drop: [zipcodeori, zipmerchant]
    desc: >-
      BankSim synthetic bank payments (595k rows, 1.2% fraud, customer/merchant/category entities). Chronological evaluation by simulation step.
  baf:
    file: baf.duckdb
    table: base
    label: "fraud_bool"
    time_col: month
    drop: []
    desc: >-
      Bank Account Fraud suite Base variant (NeurIPS 2022, 1M applications, 1.1% fraud, 8 months). Chronological evaluation by application month.
  paysim:
    file: paysim.duckdb
    table: raw
    label: "isfraud"
    time_col: step
    drop: [nameorig, namedest, isflaggedfraud]
    desc: >-
      PaySim mobile-money simulation. Chronological evaluation by step.
    final_no_xgb: true
    final_grid: [{'num_leaves': 63, 'learning_rate': 0.1, 'n_estimators': 200}, {'num_leaves': 127, 'learning_rate': 0.05, 'n_estimators': 400}]
  talkingdata:
    file: talkingdata.duckdb
    table: raw
    label: "label"
    time_col: click_time
    drop: []
    desc: >-
      Full TalkingData click-attribution training table. Chronological evaluation; search and finalization run alone.
    final_no_xgb: true
    final_grid: [{'num_leaves': 63, 'learning_rate': 0.1, 'n_estimators': 200}, {'num_leaves': 127, 'learning_rate': 0.08, 'n_estimators': 300}, {'num_leaves': 255, 'learning_rate': 0.05, 'n_estimators': 400}]
    lgbm_override: {'n_estimators': 200, 'learning_rate': 0.1, 'num_leaves': 63, 'n_jobs': 16}

  bank_marketing:
    file: bank_marketing.duckdb
    table: raw
    label: "y"
    time_col: null
    drop: [duration]
    desc: >-
      UCI Bank Marketing (Portuguese bank, 45,211 contacts, 11.7% subscribe); `duration` excluded as post-outcome; stratified random splits.
  online_shoppers:
    file: online_shoppers.duckdb
    table: raw
    label: "revenue"
    time_col: null
    drop: []
    desc: >-
      UCI Online Shoppers Purchasing Intention (12,330 sessions, 15.5% purchase); stratified random splits.
  magic_gamma:
    file: magic_gamma.duckdb
    table: raw
    label: "is_gamma"
    time_col: null
    drop: []
    desc: >-
      UCI MAGIC Gamma Telescope (19,020 showers, 64.8% gamma); gamma is the positive class per the stated task, so this is the one cell with a high AUPRC baseline; stratified random splits.
  drybean:
    file: drybean.duckdb
    table: raw
    label: "is_barbunya"
    time_col: null
    drop: []
    desc: >-
      UCI Dry Bean (13,611 segmented bean images, 16 shape descriptors); one-vs-rest on the BARBUNYA variety (9.7%); stratified random splits.
  occupancy:
    file: occupancy.duckdb
    table: raw
    label: "occupancy"
    time_col: ts
    drop: [ts, date]
    desc: >-
      UCI Occupancy Detection (20,560 minutes of room sensor readings, 23.1% occupied); the three shipped files are concatenated in true timestamp order, chronological evaluation.
  htru2:
    file: htru2.duckdb
    label: is_pulsar
    time_col: null
    drop: []
    desc: >-
      HTRU2 pulsar candidates (UCI DOI 10.24432/C5DK6R). 17,898 rows,
      1,639 confirmed pulsars. Eight physical statistics of the integrated
      profile and DM-SNR curve. No cross-row entity, but every column has
      physical meaning -- tests FORGE where the vocabulary is meaningful and
      the aggregation grammar is not applicable.
  adult:
    file: adult.duckdb
    label: income_gt_50k
    time_col: null
    drop: []
    desc: >-
      Adult Census Income (UCI DOI 10.24432/C5XW20), adult.data and
      adult.test concatenated, 48,842 rows, 23.9% above 50K. fnlwgt dropped
      as a sampling weight. Sensitive attributes retained; method evaluation
      only, not a basis for individual decisions.
  spambase:
    file: spambase.duckdb
    label: is_spam
    time_col: null
    drop: []
    desc: >-
      Spambase (UCI DOI 10.24432/C53G6X). 4,601 emails, 39.4% spam, 57
      hand-built word/character-frequency and capital-run features. Already
      engineered, so it tests whether a second engineering layer adds
      anything. Small enough for harm-only, tau and three repeats.
